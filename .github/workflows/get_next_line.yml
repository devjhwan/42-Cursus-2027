name: get_next_line Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      get_next_line: ${{ steps.filter.outputs.get_next_line }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            get_next_line:
              - 'get_next_line/**'

  check-get_next_line:
    needs: detect-changes
    if: needs.detect-changes.outputs.get_next_line == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Norminette
        run: python -m pip install norminette
      - name: Check Norminette
        run: norminette get_next_line
      - name: Compile mandatory and bonus
        run: |
          mkdir -p "$RUNNER_TEMP/get_next_line-check/mandatory"
          mkdir -p "$RUNNER_TEMP/get_next_line-check/bonus"
          cc -Wall -Wextra -Werror -D BUFFER_SIZE=42 -c get_next_line/get_next_line.c -o "$RUNNER_TEMP/get_next_line-check/mandatory/get_next_line.o"
          cc -Wall -Wextra -Werror -D BUFFER_SIZE=42 -c get_next_line/get_next_line_utils.c -o "$RUNNER_TEMP/get_next_line-check/mandatory/get_next_line_utils.o"
          cc -Wall -Wextra -Werror -D BUFFER_SIZE=42 -c get_next_line/get_next_line_bonus.c -o "$RUNNER_TEMP/get_next_line-check/bonus/get_next_line_bonus.o"
          cc -Wall -Wextra -Werror -D BUFFER_SIZE=42 -c get_next_line/get_next_line_utils_bonus.c -o "$RUNNER_TEMP/get_next_line-check/bonus/get_next_line_utils_bonus.o"
