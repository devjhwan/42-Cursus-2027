name: Libft Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      libft: ${{ steps.filter.outputs.libft }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            libft:
              - 'libft/**'

  check-libft:
    needs: detect-changes
    if: needs.detect-changes.outputs.libft == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Norminette
        run: python -m pip install norminette
      - name: Check Norminette
        run: norminette libft
      - name: Compile
        run: make -C libft
